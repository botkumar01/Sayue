<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title><meta name="description" content="Browse every book, poetry collection, printable and bundle.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head>
<body data-page="shop"><main id="main">
<div class="page-head wrap"><span class="label">The library</span><h1>Shop</h1><p>Every title arrives as a digital edition, ready to read the moment you check out.</p><div class="rule" aria-hidden="true">&#10048;</div></div>
<section style="padding-top:var(--s3)"><div class="wrap">
<div class="toolbar"><div class="search"><label class="sr" for="q">Search titles</label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search titles, tags or themes" autocomplete="off"></div>
<div><label class="sr" for="sort">Sort by</label><select class="select" id="sort"><option value="new">Newest</option><option value="lo">Price low to high</option><option value="hi">Price high to low</option></select></div></div>
<div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
<p id="resultCount" class="muted" style="margin-bottom:var(--s2)" aria-live="polite"></p>
<div class="grid" id="grid"></div></div></section></main>
<script src="assets/data.js"></script><script src="assets/app.js"></script></body></html>
